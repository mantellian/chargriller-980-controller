<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550">
  <defs>
    <style>
      .pcb-board { fill: #0b3d16; stroke: #1e5e2e; stroke-width: 2; }
      .silk-text { font-family: "Courier New", monospace; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .silk-title { font-family: "Courier New", monospace; font-size: 16px; font-weight: bold; fill: #f0f0f0; text-anchor: middle; }
      .component { fill: #1c1c1c; stroke: #888888; stroke-width: 1.5; rx: 4; }
      .display { fill: #0a0a0a; stroke: #d32f2f; stroke-width: 2; rx: 3; }
      .disp-text { font-family: "Segment7, Courier New", monospace; font-size: 28px; font-weight: bold; fill: #ff1744; text-anchor: middle; }
      .knob { fill: #2c2c2c; stroke: #d4af37; stroke-width: 3; }
      .mount-hole { fill: #1a1a1a; stroke: #d4af37; stroke-width: 3; }
      .connector { fill: #1b5e20; stroke: #81c784; stroke-width: 2; rx: 3; }
      .pin { fill: #ffd54f; stroke: #b78103; stroke-width: 1; }
      .label { font-family: sans-serif; font-size: 11px; fill: #cccccc; text-anchor: middle; }
    </style>
  </defs>

  <!-- PCB Board Base -->
  <rect x="20" y="20" width="720.0" height="510.0" rx="18" class="pcb-board" />

  <!-- 4 Corner Mounting Holes (M3 + Magnet Ring) -->
  <circle cx="50.0" cy="50.0" r="30.0" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2" />
  <circle cx="50.0" cy="50.0" r="9.600000000000001" class="mount-hole" />

  <circle cx="710.0" cy="50.0" r="30.0" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2" />
  <circle cx="710.0" cy="50.0" r="9.600000000000001" class="mount-hole" />

  <circle cx="50.0" cy="500.0" r="30.0" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2" />
  <circle cx="50.0" cy="500.0" r="9.600000000000001" class="mount-hole" />

  <circle cx="710.0" cy="500.0" r="30.0" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2" />
  <circle cx="710.0" cy="500.0" r="9.600000000000001" class="mount-hole" />

  <!-- Board Title Silkscreen -->
  <text x="380.0" y="50" class="silk-title">CHAR-GRILLER 980 DIY CONTROLLER v0.3</text>

  <!-- FRONT PANEL SECTION -->

  <!-- Left Side: KY-040 Rotary Encoder Knob -->
  <rect x="92.0" y="92.0" width="192.0" height="192.0" class="component" />
  <circle cx="188.0" cy="188.0" r="78.0" class="knob" />
  <line x1="188.0" y1="188.0" x2="188.0" y2="122.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <text x="188.0" y="308.0" class="silk-title" font-size="12">ENCODER / DIAL</text>
  <text x="188.0" y="332.0" class="label">(Push to Confirm/Silence)</text>

  <!-- Right Side: Dual TM1637 Displays (Stacked) -->
  <!-- Top Display: Current Pit Temp -->
  <rect x="332.0" y="80.0" width="336.0" height="120.0" class="display" />
  <text x="500.0" y="164.0" class="disp-text">225 °F</text>
  <text x="500.0" y="74.0" class="silk-text" text-anchor="middle">CURRENT PIT TEMP</text>

  <!-- Bottom Display: Target Setpoint -->
  <rect x="332.0" y="224.0" width="336.0" height="120.0" class="display" />
  <text x="500.0" y="308.0" class="disp-text">225 °F</text>
  <text x="500.0" y="218.0" class="silk-text" text-anchor="middle">TARGET SETPOINT</text>

  <!-- BOTTOM SECTION: Industrial Quick-Disconnect Harness -->
  <rect x="140.0" y="410.0" width="480.0" height="84.0" class="connector" />
  <text x="380.0" y="392.0" class="silk-text" text-anchor="middle">QUICK-DISCONNECT WIRE HARNESS (5.08mm)</text>

    <rect x="160.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="168.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">12V+</text>
    
    <rect x="217.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="225.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">GND</text>
    
    <rect x="274.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="282.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">FAN+</text>
    
    <rect x="331.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="339.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">FAN-</text>
    
    <rect x="388.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="396.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">DOOR</text>
    
    <rect x="445.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="453.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">DGND</text>
    
    <rect x="502.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="510.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">RTD+</text>
    
    <rect x="559.0" y="440.0" width="16" height="16" rx="2" class="pin" />
    <text x="567.0" y="466.0" font-family="monospace" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">RTD-</text>
    
</svg>
